name: Test and deploy RV Dashboard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rv-dashboard-pages
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: python3 publish.py --build-only
      - run: python3 -m unittest discover -s tests -v
      - run: pnpm run test:model
      - run: pnpm run test:worker
      - run: pnpm run check:worker
      - run: python3 peer_status.py
      - name: Browser regression
        run: |
          python3 -m http.server 8766 --directory public &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          pnpm run test:browser -- http://127.0.0.1:8766/
      - uses: actions/upload-pages-artifact@v4
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        with:
          path: public

  deploy:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: tests
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  auto-merge-rv-data:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'automated-rv-data' &&
      vars.RV_UPLOAD_APP_LOGIN != '' &&
      github.actor == vars.RV_UPLOAD_APP_LOGIN &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'automation/rv-data-') &&
      contains(github.event.pull_request.labels.*.name, 'automated-rv-data')
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Require exactly one changed data file
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr diff "$PR_URL" --name-only | python3 scripts/verify_data_only_pr.py
      - name: Merge verified data update
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --squash --delete-branch
      - name: Trigger main deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

  auto-merge-luac-data:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'automated-luac-data' &&
      vars.RV_UPLOAD_APP_LOGIN != '' &&
      github.actor == vars.RV_UPLOAD_APP_LOGIN &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'automation/luac-data-') &&
      contains(github.event.pull_request.labels.*.name, 'automated-luac-data')
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Require exactly one changed LUAC data file
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr diff "$PR_URL" --name-only | python3 scripts/verify_luac_data_only_pr.py
      - name: Merge verified LUAC data update
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --squash --delete-branch
      - name: Trigger main deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
